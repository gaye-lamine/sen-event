image: node:20-alpine

stages:
  - build
  - deploy

variables:
  # Identifiant Netlify du site senevent
  NETLIFY_SITE_ID: "84de2264-fd52-472c-8116-3ffcdeac648e"
  # Désactivation des analyses Auto DevOps lourdes
  CODE_QUALITY_DISABLED: "true"
  AUTO_DEVOPS_EXPLICITLY_ENABLED: "false"

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

before_script:
  - npm ci --cache .npm --prefer-offline

# 1. Compilation & Vérification
build_frontend:
  stage: build
  script:
    - npm run build
  artifacts:
    name: "sunuevents-dist"
    expire_in: 7 days
    paths:
      - dist/
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# 2. Déploiement direct en production sur Netlify (https://senevent.netlify.app)
deploy_to_netlify:
  stage: deploy
  script:
    - npx netlify-cli deploy --dir=dist --prod --site=$NETLIFY_SITE_ID --auth=$NETLIFY_AUTH_TOKEN
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
